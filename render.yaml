# Render Blueprint (https://render.com/docs/blueprint-spec) for the backend + its database.
# Deploy: push this repo to GitHub, then in Render "New +" -> "Blueprint" -> point at the repo.
# See docs/deploying.md for the full walkthrough, including the frontend (hosted separately on
# Vercel/Netlify -- this blueprint only covers what actually needs a server: the API + DB).
#
# data/ and models/ (Phases 2-12's gitignored, reproducible-via-pipeline output) are symlinked
# into the persistent disk below rather than the disk being mounted directly over `data/` or
# `models/` -- this avoids hardcoding Render's absolute filesystem prefix (which this project
# can't verify without a real account) while still surviving redeploys. Re-run once by hand.
#
# The symlinks are created in startCommand, not buildCommand: Render builds run in a separate,
# sandboxed builder where the persistent disk isn't attached yet (confirmed by a real deploy --
# `mkdir /data` failed there with "Read-only file system"). The disk only attaches once the
# service actually starts, so that's the only place `/data` is writable.
#
# `rm -rf ./data ./models` BEFORE the `ln -sfn` calls is required, not optional: this repo
# commits empty `data/`/`models/` directories (with `.gitkeep` placeholders, so the structure
# exists in git even though their contents are gitignored). `ln -sfn target ./data` behaves
# completely differently when `./data` already exists as a real directory -- instead of
# replacing it with a symlink, `ln` creates the symlink *inside* it (`./data/mip-data`),
# silently leaving the real, ephemeral, git-checked-out `data/` directory as what everything
# actually reads/writes. Confirmed by a real deploy: `ls -la data` showed `features/`,
# `processed/`, `raw/` as ordinary directories sitting next to a `mip-data -> /data/mip-data`
# symlink nobody was using. The `rm -rf` first ensures `ln -sfn` lands exactly on `./data`
# and `./models` themselves.
#
# plan: starter (not free) -- Render's free-tier web services don't support persistent disks at
# all ("disks are not supported for free tier services"), and this project needs one: without a
# disk, data/models would need regenerating from scratch every time a free-tier service spins
# down from inactivity and back up (see docs/deploying.md's cost/limits section).
services:
  - type: web
    name: market-intelligence-platform-api
    runtime: python
    plan: starter
    buildCommand: >-
      cd backend &&
      pip install torch --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: >-
      mkdir -p /data/mip-data /data/mip-models &&
      rm -rf ./data ./models &&
      ln -sfn /data/mip-data ./data &&
      ln -sfn /data/mip-models ./models &&
      cd backend &&
      uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: mip-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        # Pinned to match the exact version this project was built and tested against locally
        # (see docs/testing.md's coverage output) -- Render otherwise defaults to whatever its
        # latest available Python is (3.14.3 as of this writing), which is new enough that some
        # pinned dependencies (torch, numpy, pandas, scikit-learn) may not ship prebuilt wheels
        # for it yet.
        value: 3.13.14
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true   # Render generates a strong random secret -- never commit one
      - key: DATABASE_URL
        fromDatabase:
          name: market-intelligence-platform-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false   # set manually once you know your Vercel/Netlify URL -- see docs/deploying.md

databases:
  - name: market-intelligence-platform-db
    plan: free
    databaseName: market_intelligence
    user: mip
